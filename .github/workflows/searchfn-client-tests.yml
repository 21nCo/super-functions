name: SearchFn Client Tests and Minimum Node Runtime

on:
  push:
    branches: [dev, next, main]
    paths:
      - "searchfn/client/**"
      - "searchfn/core/**"
      - "searchfn/adapter-contracts/**"
      - "searchfn/adapter-memory/**"
      - "searchfn/adapter-indexeddb/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci-install-rollup-native.mjs"
      - ".github/workflows/searchfn-client-tests.yml"
  pull_request:
    branches: [dev, next, main]
    paths:
      - "searchfn/client/**"
      - "searchfn/core/**"
      - "searchfn/adapter-contracts/**"
      - "searchfn/adapter-memory/**"
      - "searchfn/adapter-indexeddb/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci-install-rollup-native.mjs"
      - ".github/workflows/searchfn-client-tests.yml"

jobs:
  test-and-node-18-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test harness Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install client workspace from the root lockfile
        run: npm ci --ignore-scripts --workspace @searchfn/client --include-workspace-root=false

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Run client tests
        run: npm --workspace @searchfn/client test -- --run

      - name: Build client and workspace dependencies
        run: |
          npm run build --workspace @searchfn/core
          npm run build --workspace @searchfn/adapter-contracts
          npm run build --workspace @searchfn/adapter-memory
          npm run build --workspace @searchfn/adapter-indexeddb
          npm run build --workspace @searchfn/client

      - name: Setup minimum runtime Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"

      - name: Verify built client on minimum runtime
        run: node --test searchfn/client/runtime-tests/minimum-node.test.mjs

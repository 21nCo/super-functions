name: SearchFn Client Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "searchfn/client/**"
      - ".github/workflows/searchfn-client-tests.yml"
  pull_request:
    branches: [dev]
    paths:
      - "searchfn/client/**"
      - ".github/workflows/searchfn-client-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    defaults:
      run:
        working-directory: searchfn/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup native package
        run: node ../../scripts/ci-install-rollup-native.mjs

      - name: Run tests
        run: npm test

name: Publish tagged Python library

on:
  push:
    tags:
      - 'python-*-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable python-<project>-v<PEP440-version> tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  # Production consumers resolve real published prerequisites, never local wheels.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_FIND_LINKS: ''
  PIP_NO_INDEX: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.source.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require immutable tag
        id: source
        run: node scripts/assert-release-ref.mjs "${RELEASE_TAG}"
      - name: Install release tools
        run: python -m pip install build twine packaging
      - name: Resolve exact package and version
        run: python scripts/python_release.py resolve "${RELEASE_TAG}"
      - name: Reject occupied or regressive PyPI version
        run: python scripts/python_release.py check-registry "${RELEASE_TAG}"
      - name: Build sdist and wheel, check metadata and test installed library
        id: build
        run: python scripts/python_release.py build "${RELEASE_TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: ${{ steps.build.outputs.artifact_dir }}/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILT_COMMIT: ${{ needs.build.outputs.release_commit }}
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Recheck immutable tag and exact artifact identity
        run: |
          node scripts/assert-release-ref.mjs "${RELEASE_TAG}" "${BUILT_COMMIT}"
          python -m pip install packaging twine
          python scripts/python_release.py check-registry "${RELEASE_TAG}"
          python scripts/python_release.py verify "${RELEASE_TAG}" --out-dir dist
          python -m twine check --strict dist/*
      - name: Publish exact validated distributions through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true

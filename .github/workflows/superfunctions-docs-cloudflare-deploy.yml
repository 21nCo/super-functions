name: Superfunctions Docs Cloudflare Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - dev
    tags:
      - superfunctions-docs-live-*
      - superfunctions-docs-datafn-live-*
      - superfunctions-docs-filefn-live-*
      - superfunctions-docs-searchfn-live-*
      - superfunctions-docs-authfn-live-*
      - superfunctions-datafn-docs-live-*
      - superfunctions-filefn-docs-live-*
      - superfunctions-searchfn-docs-live-*
      - superfunctions-authfn-docs-live-*
    paths:
      - datafn/docs/**
      - filefn/docs/**
      - searchfn/docs/**
      - authfn/docs/**
      - docsfn/**
      - packages/docs-theme/**
      - scripts/cloudflare-docs/**
      - package.json
      - package-lock.json
      - turbo.json
      - .github/workflows/superfunctions-docs-cloudflare-deploy.yml
  workflow_dispatch:
    inputs:
      product:
        description: Docs product to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - datafn
          - filefn
          - searchfn
          - authfn
      environment:
        description: Docs environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - live

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      products: ${{ steps.detect.outputs.products }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_PRODUCT: ${{ github.event.inputs.product }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-docs/select-products.mjs | tee /tmp/docs-deploy-detect.out
          cat /tmp/docs-deploy-detect.out >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.products != '[]'
    environment: ${{ needs.detect.outputs.environment }}
    concurrency:
      group: superfunctions-docs-cloudflare-${{ needs.detect.outputs.environment }}-${{ matrix.product }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.detect.outputs.products) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      # Dev docs deploy to the 21n-dev Cloudflare account.
      - name: Check 21n-dev Cloudflare credentials
        if: needs.detect.outputs.environment == 'dev'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_DEV_API_TOKEN secret or CLOUDFLARE_DEV_ACCOUNT_ID variable is missing; refusing to deploy dev docs."
            exit 1
          fi

      - name: Deploy docs Worker (dev)
        if: needs.detect.outputs.environment == 'dev'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
          DOCS_PRODUCT: ${{ matrix.product }}
        run: node scripts/cloudflare-docs/deploy.mjs dev --products="$DOCS_PRODUCT"

      # Live docs deploy to the production account (unchanged).
      - name: Deploy docs Worker (live)
        if: needs.detect.outputs.environment == 'live'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_PRODUCT: ${{ matrix.product }}
        run: node scripts/cloudflare-docs/deploy.mjs live --products="$DOCS_PRODUCT"

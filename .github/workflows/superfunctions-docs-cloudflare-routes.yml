name: Superfunctions Docs Cloudflare Routes

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      product:
        description: Docs product routes to sync
        required: true
        type: choice
        default: all
        options:
          - all
          - datafn
          - filefn
          - searchfn
          - authfn
      environment:
        description: Docs route environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - live

jobs:
  routes:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: superfunctions-docs-cloudflare-routes-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dev docs routes live on the 21n.site zone in the 21n-dev account
      # (<product>.21n.site/docs*). Zone ID is the 21n-dev copy of 21n.site
      # (not secret); without it the script looks the zone up by name scoped
      # to CLOUDFLARE_ACCOUNT_ID.
      - name: Sync Cloudflare docs routes (dev)
        if: github.event.inputs.environment == 'dev'
        env:
          CLOUDFLARE_ROUTES_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID_21N_SITE: 239fc6cebbd75b5401fe61f217f920bb
        run: node scripts/cloudflare-docs/sync-routes.mjs dev --products=${{ github.event.inputs.product }}

      # Live routes stay on each product zone in the production account (unchanged).
      - name: Sync Cloudflare docs routes (live)
        if: github.event.inputs.environment == 'live'
        env:
          CLOUDFLARE_ROUTES_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID_DATAFN_DEV: ${{ vars.CLOUDFLARE_ZONE_ID_DATAFN_DEV }}
          CLOUDFLARE_ZONE_ID_FILEFN_COM: ${{ vars.CLOUDFLARE_ZONE_ID_FILEFN_COM }}
          CLOUDFLARE_ZONE_ID_SEARCHFN_COM: ${{ vars.CLOUDFLARE_ZONE_ID_SEARCHFN_COM }}
          CLOUDFLARE_ZONE_ID_AUTHFN_COM: ${{ vars.CLOUDFLARE_ZONE_ID_AUTHFN_COM }}
        run: node scripts/cloudflare-docs/sync-routes.mjs live --products=${{ github.event.inputs.product }}

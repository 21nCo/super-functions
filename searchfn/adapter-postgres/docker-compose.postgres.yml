services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: searchfn
      POSTGRES_PASSWORD: searchfn_test
      POSTGRES_DB: searchfn_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchfn -d searchfn_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "searchfn"
version = "0.1.0"
description = "Python searchfn kernel — inverted-index search over a duck-typed db adapter"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "21n"}
]
keywords = ["search", "full-text", "superfunctions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Repository = "https://github.com/21nCo/super-functions"
Issues = "https://github.com/21nCo/super-functions/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/searchfn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
exclude = '^(build|dist|tests)/'

name: API Contract Check

on:
  pull_request:
    paths:
      - "apifn/**"
      - ".apifn/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  api-check:
    # Registered reusable path (still runs in the caller checkout, which must
    # include the @apifn/cli workspace):
    # uses: 21nCo/super-functions/.github/workflows/apifn-api-check.yml@dev
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      spec_path: .apifn/openapi.yml
      collection_dir: .apifn/collection
      environment: development
      base_branch: main
      fail_on_breaking: true
      post_pr_comment: true

openapi: '3.1.0'
info:
  title: Test API
  version: '1.1.0'
paths:
  /users:
    get:
      summary: List users (updated)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: filter
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /users/{id}:
    get:
      summary: Get user
      responses:
        '200':
          description: OK
  /orders:
    get:
      summary: List orders
      responses:
        '200':
          description: OK

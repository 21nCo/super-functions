openapi: '3.1.0'
info:
  title: Test API
  version: '1.0.0'
paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
  /users/{id}:
    get:
      summary: Get user
      responses:
        '200':
          description: OK
    delete:
      summary: Delete user
      responses:
        '204':
          description: Deleted

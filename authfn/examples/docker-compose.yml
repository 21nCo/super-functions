services:
  postgres:
    image: postgres:16-alpine
    container_name: authfn-examples-postgres
    environment:
      POSTGRES_DB: authfn_examples
      POSTGRES_USER: authfn
      POSTGRES_PASSWORD: authfn
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authfn -d authfn_examples"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - authfn-examples-postgres:/var/lib/postgresql/data

volumes:
  authfn-examples-postgres:

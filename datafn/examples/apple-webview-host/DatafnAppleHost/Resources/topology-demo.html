<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataFn Apple Host Bootstrap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(65, 160, 255, 0.25), transparent 38%),
          radial-gradient(circle at bottom right, rgba(255, 168, 76, 0.28), transparent 42%),
          #0d1117;
        color: #f3f6fa;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        border-radius: 24px;
        padding: 24px;
        background: rgba(9, 14, 23, 0.78);
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 2vw + 1rem, 2.6rem);
      }
      p {
        color: rgba(243, 246, 250, 0.82);
        line-height: 1.5;
      }
      pre {
        overflow: auto;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
      }
      code {
        font-family: "SF Mono", "Cascadia Code", monospace;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>DataFn Apple Host</h1>
      <p>
        The native host already injected the topology bootstrap payload. Point
        this host at the Vite todo app to run the same web app inside
        <code>WKWebView</code>.
      </p>
      <pre><code id="payload"></code></pre>
    </section>
    <script>
      const payload = window.__DATAFN_EXAMPLE_TOPOLOGY__ ?? {
        note: "No topology payload was injected.",
      };
      document.getElementById("payload").textContent = JSON.stringify(
        payload,
        null,
        2,
      );
    </script>
  </body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billfn"
version = "0.1.0"
description = "Python SDK for billfn - typed billing and entitlements client for superfunctions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["billing", "subscriptions", "entitlements", "superfunctions"]
authors = [
  { name = "21n" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.5.0",
  "superfunctions>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "mypy>=1.7.0",
  "ruff>=0.1.6",
  "black>=23.11.0",
]

[project.urls]
Documentation = "https://docs.superfunctions.dev/billfn"
Repository = "https://github.com/21nCo/super-functions"
Issues = "https://github.com/21nCo/super-functions/issues"

[tool.hatch.build.targets.wheel]
packages = ["billfn"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = '^(build|dist|tests|examples)(/|$)'

[[tool.mypy.overrides]]
module = [
  "superfunctions.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
